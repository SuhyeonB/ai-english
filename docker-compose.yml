services:
  mysql:
    image: mysql:8.0
    container_name: ai-english-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ai_english
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    extra_hosts:
      - "localhost:host-gateway"
    restart: always

  redis:
    image: redis:7.0
    container_name: ai-english-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: ai-english-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: always

  logstash:
    image: logstash:8.13.0
    container_name: ai-english-logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "5044:5044"   # Beats input (나중에 Filebeat 붙일 때)
      - "5001:5000"   # TCP input (앱에서 직접 전송)
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    depends_on:
      - elasticsearch
    restart: always

  kibana:
    image: kibana:8.13.0
    container_name: ai-english-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    restart: always

volumes:
  mysql-data:
  redis-data:
  es-data: